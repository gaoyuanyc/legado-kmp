name: Build libshared.so (Kotlin-OHOS)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['shared/**', 'harmonyKmp/**', '.github/workflows/build-harmony-so.yml']

jobs:
  build-harmony-so:
    runs-on: macos-26  # Apple Silicon ARM64 (Kotlin-OHOS toolchain is macOS-aarch64 only)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 1. Set up JDK 17 for Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        id: jdk17
        with:
          distribution: 'zulu'
          java-version: '17'

      # 2. Download Kotlin-OHOS prebuilt toolchain (compiler, macOS aarch64)
      - name: Download Kotlin-OHOS toolchain
        run: |
          set -euo pipefail
          mkdir -p ~/.konan

          # zxystd/Kotlin-OHOS release 0.0.1 (verified 200 OK, 347MB)
          TOOLCHAIN_URL="https://github.com/zxystd/Kotlin-OHOS/releases/download/0.0.1/kotlin-native-prebuilt-macos-aarch64-2.1.255-SNAPSHOT.tar.gz"

          echo "Downloading Kotlin-OHOS toolchain (347MB)..."
          curl -sSL -o /tmp/kn-ohos.tar.gz "$TOOLCHAIN_URL"

          echo "Extracting toolchain..."
          tar -xf /tmp/kn-ohos.tar.gz -C ~/.konan/
          echo "Toolchain extracted to ~/.konan/"
          ls -la ~/.konan/ | head -20

      # 3. Download fork repo (KGP 2.1.255-SNAPSHOT + fork-patched kotlinx libs, maven repo)
      - name: Download fork maven repo (repo_kotlinx.zip, 1.19GB)
        run: |
          set -euo pipefail
          mkdir -p ~/ohos-fork-repo

          REPO_URL="https://github.com/zxystd/Kotlin-OHOS/releases/download/0.0.1/repo_kotlinx.zip"

          echo "Downloading repo_kotlinx.zip (1.19GB)..."
          curl -sSL -o /tmp/repo_kotlinx.zip "$REPO_URL"

          echo "Extracting maven repo..."
          unzip -q -o /tmp/repo_kotlinx.zip -d ~/ohos-fork-repo
          echo "Extracted. Contents:"
          ls ~/ohos-fork-repo
          echo "--- Check for KGP artifact ---"
          find ~/ohos-fork-repo -maxdepth 3 -iname "*gradle-plugin*" 2>/dev/null | head -5

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # 5. Build libshared.so (harmonyKmp standalone module)
      - name: Build libshared.so
        env:
          HARMONY_KOTLIN_REPO: $HOME/ohos-fork-repo
        run: |
          export JAVA_HOME=${{ steps.jdk17.outputs.path }}
          export KONAN_DATA_DIR=$HOME/.konan

          echo "=== Building libshared.so (harmonyKmp) ==="
          export HARMONY_KOTLIN_REPO=$HOME/ohos-fork-repo
          ./gradlew -p harmonyKmp :linkHarmonyOSArm64 \
            --no-daemon \
            --stacktrace

      # 6. Verify outputs
      - name: Verify outputs
        run: |
          echo "=== Searching for .so / .h files ==="
          find harmonyKmp/build -name "*.so" -exec ls -lh {} \; 2>/dev/null || echo "No .so files"
          find harmonyKmp/build -name "*.h" -exec ls -lh {} \; 2>/dev/null || echo "No .h files"

      # 7. Upload artifacts
      - name: Upload libshared.so
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: libshared-harmonyos
          path: |
            harmonyKmp/build/bin/**/*.so
            harmonyKmp/build/bin/**/*.h
          retention-days: 30
          if-no-files-found: ignore

  # Always run JVM tests
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Run JVM tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-report
          path: shared/build/reports/tests/